name: Update wellness data

on:
  schedule:
    - cron: '45 5 * * *'   # 07:45 Uhr (Sommerzeit) — Morgen-Run
    - cron: '0 8 * * *'    # 10:00 Uhr — Wochenend-Backup
  workflow_dispatch:         # manuell via Website-Button

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch data
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE: ${{ secrets.INTERVALS_ATHLETE }}
        run: python fetch_data.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --staged --quiet || git commit -m "data: update $(date -u +%Y-%m-%dT%H:%M)"
          git push
